  <!--
    ================= HOW TO ADD A PHOTO =================
    1. Upload your photo into the folder assets/gallery/ on GitHub
       (open the folder, then Add file → Upload files).
       Tip: keep photos under ~1 MB; resize big phone photos first.
    2. Copy this block and paste it where you want the photo to appear
       (newest at the top is a good habit):

    <figure>
      <img src="assets/gallery/YOUR-FILE-NAME.jpg" alt="Short description of the photo" loading="lazy">
      <figcaption>Caption shown under the photo · Place, Year</figcaption>
    </figure>

    3. Change YOUR-FILE-NAME.jpg to the exact file name (capital letters matter!),
       and write your own description and caption. The caption line is optional;
       delete it if you don't want one.
    To remove a photo, delete its whole <figure> ... </figure> block.
    ======================================================
  -->

  <div class="gallery">
    <figure>
      <img src="assets/gallery/photo1.jpg" alt="Placeholder photo 1" loading="lazy">
